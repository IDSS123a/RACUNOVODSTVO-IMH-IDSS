[package]
name = "fakturisanje-imh-idss"
version = "0.1.0"
description = "Offline billing desktop app for IMH and IDSS"
authors = ["IDSS123a"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "fakturisanje_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4" }
tauri-plugin-log = "2"
