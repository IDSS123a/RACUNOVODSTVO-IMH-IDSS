[package]
name = "fakturisanje-imh-idss"
version = "0.2.0"
description = "Offline billing desktop app for IMH and IDSS"
authors = ["IDSS123a"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "fakturisanje_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.40.2", features = ["bundled", "serialize"] }
aes-gcm = "0.11.1"
rand = "0.10.3"
base64 = "0.23.1"
thiserror = "2.0.21"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }
